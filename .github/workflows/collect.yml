name: Collect Steam Players

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */3 * * *'

permissions:
  contents: write

concurrency:
  group: steam-player-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Steam player counts in saved batches
        id: collect
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          total=$(python -c "import json; print(len({int(g['appid']) for g in json.load(open('games.json')) if g.get('appid')}))")
          batch_size=100
          for ((offset=0; offset<total; offset+=batch_size)); do
            echo "Collecting batch starting at $offset of $total"
            set +e
            H1G_BATCH_OFFSET="$offset" H1G_BATCH_SIZE="$batch_size" python collect.py
            collect_result=$?
            set -e

            if [ -d data ]; then git add -A -- data/; fi
            if [ -d status ]; then git add -A -- status/; fi
            if [ -d archive ]; then git add -A -- archive/; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update Steam player statistics (batch $((offset / batch_size + 1)))"
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase origin/main; then
                  echo "Rebase conflict: preserving existing data and stopping safely."
                  git rebase --abort || true
                  exit 1
                fi
                if git push origin HEAD:main; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Push failed after three attempts."
                  exit 1
                fi
                sleep 3
              done
            fi

            if [ "$collect_result" -ne 0 ]; then
              echo "Collection batch failed; saved all completed records."
              exit "$collect_result"
            fi
          done

      - name: Save any remaining data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add -A -- data/; fi
          if [ -d status ]; then git add -A -- status/; fi
          if [ -d archive ]; then git add -A -- archive/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save remaining Steam player statistics"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict: preserving existing data and stopping safely."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after three attempts."
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Check collection result
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Steam player collection encountered errors."
          exit 1
